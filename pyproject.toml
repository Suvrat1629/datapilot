[project]
name = "datapilot"
version = "0.1.0"
description = "Agentic AI data agent: natural-language SQL and ETL over any PostgreSQL database"
authors = [
    { name = "Suvrat Acharya", email = "suvrat1629@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-core>=1.7.0",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langfuse>=5,<6",
    "langgraph>=1.2.17",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sqlglot>=30.24.0",
    "typer>=0.27.3",
]

[project.scripts]
datapilot = "datapilot.cli:app"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs the Postgres container running",
    "real_guard: run the CLI role guard instead of skipping it",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
